<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Atelier Folio — Des portfolios qui ont du style</title>
<meta name="description" content="Atelier Folio : des portfolios animés, prêts à personnaliser. Prenez le volant et visitez ce petit monde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&family=DM+Mono:wght@400;500&family=Stardos+Stencil&display=swap">
<style>
/* Vitrine : un petit monde en 3D à la tombée du jour ; interface fine, sombre et crème par-dessus. */
:root {
  --night: #1a1638;      /* encre presque noire */
  --cream: #efe6d6;      /* crème papier */
  --amber: #ffb066;      /* lumière de lanterne */
  --glass: rgba(26, 22, 56, .5);
  --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream); font-family: var(--f-sans);
  -webkit-font-smoothing: antialiased; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
body.grabbing canvas#world { cursor: grabbing; }
.label { font: 400 .68rem var(--f-mono); letter-spacing: .22em; text-transform: uppercase; }

/* Chargement : rideau qui s'ouvre */
.loader { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.loader .panel { position: absolute; left: 0; right: 0; height: 50.5%; background: var(--night); transition: transform 1.5s cubic-bezier(.77,0,.18,1); }
.loader .p-top { top: 0; } .loader .p-bot { bottom: 0; }
.loader.open .p-top { transform: translateY(-100%); }
.loader.open .p-bot { transform: translateY(100%); transition-delay: .06s; }
.loader .info { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; transition: opacity .5s; }
.loader.open .info { opacity: 0; }
.loader .count { display: block; font: italic 400 clamp(5rem, 18vw, 12rem)/1 var(--f-serif); color: var(--cream); font-variant-numeric: tabular-nums; }
.loader .label { color: rgba(239,230,214,.55); display: block; margin-top: 1rem; }
.loader .bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 3rem); height: 1px; width: 0; max-width: 40vw; background: var(--amber); transform: translateX(-50%); }

/* Interface */
.ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; padding: calc(env(safe-area-inset-top, 0px) + 1.1rem) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
.pills { display: flex; gap: .5rem; pointer-events: auto; }
.pill { font: 400 .66rem var(--f-mono); letter-spacing: .16em; text-transform: uppercase; padding: .7rem 1.1rem; border-radius: 999px; border: 1px solid rgba(239,230,214,.35); color: var(--cream); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-decoration: none; transition: background .4s, color .4s, border-color .4s; }
.pill:hover { background: var(--cream); color: var(--night); border-color: var(--cream); }
.pill.solid { background: var(--cream); color: var(--night); border-color: var(--cream); }
.pill.solid:hover { background: var(--amber); border-color: var(--amber); }

.zone { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 5rem); transform: translateX(-50%); text-align: center; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.zone .label { display: block; color: var(--amber); clip-path: inset(0 0 100% 0); transform: translateY(8px); transition: clip-path .8s cubic-bezier(.77,0,.18,1), transform .8s cubic-bezier(.77,0,.18,1); }
.zone b { display: block; margin-top: .3rem; font: italic 400 clamp(2.6rem, 7vw, 5.4rem)/1 var(--f-serif); white-space: nowrap; clip-path: inset(0 0 100% 0); transform: translateY(40px); transition: clip-path 1s .08s cubic-bezier(.77,0,.18,1), transform 1s .08s cubic-bezier(.77,0,.18,1); }
.zone.on .label, .zone.on b { clip-path: inset(-10% 0 -20% 0); transform: none; }
.zone.off .label, .zone.off b { clip-path: inset(0 0 0 0); transform: translateY(-30px); opacity: 0; transition-duration: .6s; }

.hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 1.6rem); margin: 0; transform: translate(0, 14px); color: rgba(239,230,214,.75); opacity: 0; transition: opacity 1s, transform 1s cubic-bezier(.16,1,.3,1); white-space: nowrap; }
.hint.show { opacity: 1; transform: none; }
.hint.gone { opacity: 0; transform: translate(0, 14px); }

.speed { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 1.2rem); text-align: right; opacity: 0; transition: opacity 1s; }
.speed.show { opacity: 1; }
.speed b { display: block; font: italic 400 clamp(2.8rem, 6vw, 4rem)/.9 var(--f-serif); font-variant-numeric: tabular-nums; }
.speed .label { color: rgba(239,230,214,.6); }

.touch { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); display: none; justify-content: space-between; align-items: flex-end; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); opacity: 0; transition: opacity 1s; pointer-events: auto; }
.touch.show { opacity: 1; }
.touch .grp { display: flex; gap: .6rem; align-items: flex-end; }
.touch button { width: 4.1rem; height: 4.1rem; border-radius: 50%; border: 1px solid rgba(239,230,214,.35); background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 400 1.3rem var(--f-sans); color: var(--cream); touch-action: none; }
.touch button.on { background: var(--cream); color: var(--night); }
.touch button.small { width: 2.9rem; height: 2.9rem; font-size: 1rem; }
@media (hover: none) and (pointer: coarse) { .touch { display: flex; } .hint, .speed { display: none; } }

.wipe { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(circle at 50% 60%, transparent 0 35%, rgba(239,230,214,.35) 75%); opacity: 0; transition: opacity 1.2s; }
.wipe.on { opacity: 1; transition: opacity .15s; }
.glerr { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 200; background: var(--night); color: var(--cream); padding: 1.1rem 1.3rem; border-radius: .9rem; border: 1px solid rgba(239,230,214,.25); font: 400 .9rem var(--f-sans); max-width: 80vw; text-align: center; }
.glerr button { margin-top: .8rem; font: 500 .8rem var(--f-sans); padding: .55rem 1.1rem; border-radius: 99px; border: 0; background: var(--cream); color: var(--night); }
@media (max-width: 640px) { .pills .pill:not(.solid) { display: none; } }
@media (prefers-reduced-motion: reduce) { .loader .panel, .zone .label, .zone b { transition: none !important; } }
:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }
.reset { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); width: 2.9rem; height: 2.9rem; border-radius: 50%; border: 1px solid rgba(239,230,214,.35); background: var(--glass); color: var(--cream); font: 400 1rem var(--f-sans); pointer-events: auto; display: none; opacity: 0; transition: opacity 1s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.reset.show { opacity: 1; }
.hint .mob { display: none; }
@media (hover: none) and (pointer: coarse) { .reset { display: block; } .hint { display: block !important; left: 50%; transform: translate(-50%, 14px); } .hint.show { transform: translate(-50%, 0); } .hint .desk { display: none; } .hint .mob { display: inline; } }
.portal { position: fixed; inset: 0; z-index: 90; background: #0d0d0d; clip-path: circle(0% at 50% 55%); transition: clip-path .9s cubic-bezier(.77,0,.18,1); pointer-events: none; }
.portal.in { clip-path: circle(150% at 50% 55%); }
/* Vers la forêt (contact) : des stores se ferment, de gauche à droite, en décalé */
.blinds { position: fixed; inset: 0; z-index: 90; display: grid; grid-template-rows: repeat(8, 1fr); pointer-events: none; }
.blinds i { background: #0d0d0d; transform: scaleX(0); transform-origin: left center; transition: transform .75s cubic-bezier(.77,0,.18,1); }
.blinds i:nth-child(even) { transform-origin: right center; }
.blinds.in i { transform: scaleX(1.001); }
.blinds i:nth-child(1) { transition-delay: 0s; } .blinds i:nth-child(2) { transition-delay: .05s; } .blinds i:nth-child(3) { transition-delay: .1s; } .blinds i:nth-child(4) { transition-delay: .15s; }
.blinds i:nth-child(5) { transition-delay: .2s; } .blinds i:nth-child(6) { transition-delay: .25s; } .blinds i:nth-child(7) { transition-delay: .3s; } .blinds i:nth-child(8) { transition-delay: .35s; }
/* Vers le moulin (portfolio) : un rideau couleur béton monte, le nom apparaît */
.curtain { position: fixed; inset: 0; z-index: 90; background: #dededc; color: #111; display: grid; place-items: center; text-align: center; transform: translateY(101%); transition: transform 1.1s cubic-bezier(.77,0,.18,1); pointer-events: none; }
.curtain.in { transform: none; }
.curtain .label { display: block; color: #5f5f5c; opacity: 0; transform: translateY(10px); transition: opacity .6s .8s, transform .8s .8s cubic-bezier(.16,1,.3,1); }
.curtain b { display: block; margin-top: .8rem; font: 500 clamp(2.4rem, 7vw, 5.5rem)/.95 "Inter Tight", sans-serif; letter-spacing: -.045em; clip-path: inset(0 0 100% 0); transform: translateY(30px); transition: clip-path 1s .9s cubic-bezier(.77,0,.18,1), transform 1s .9s cubic-bezier(.77,0,.18,1); }
.curtain.in .label { opacity: 1; transform: none; } .curtain.in b { clip-path: inset(-10% 0 -15% 0); transform: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="world" aria-label="Petit monde en 3D : conduisez la 2CV avec les flèches du clavier"></canvas>

<div class="loader" id="loader" aria-hidden="true">
  <div class="panel p-top"></div><div class="panel p-bot"></div>
  <div class="info"><div><span class="count" id="count">00</span><span class="label">Atelier Folio</span></div></div>
  <div class="bar" id="bar"></div>
</div>

<div class="wipe" id="wipe"></div>
<div class="portal" id="portal" aria-hidden="true"></div>
<div class="blinds" id="blinds" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="curtain" id="curtain" aria-hidden="true"><div><span class="label">Le moulin mène à</span><b>Gabriel Aillet</b></div></div>

<div class="ui">

  <div class="zone" id="zone" aria-live="polite"><span class="label" id="zone-k"></span><b id="zone-t"></b></div>

  <p class="hint label" id="hint"><span class="desk">↑ ← ↓ → conduire &nbsp;·&nbsp; glisser pour tourner la vue</span><span class="mob">Posez le doigt : la voiture le suit</span></p>

  <div class="speed" id="speedo" aria-hidden="true"><b id="kmh">0</b><span class="label">km/h</span></div>

  <button id="reset" class="reset" type="button" aria-label="Remettre la voiture au départ">⟲</button>
</div>

<script type="module" src="./main.js?v=1795628779"></script>
</body>
</html>
