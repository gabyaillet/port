<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atelier Folio — Des portfolios qui ont du style</title>
<meta name="description" content="Atelier Folio : des portfolios animés, prêts à personnaliser. Prenez le volant et visitez la ville.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Vitrine : une mini-ville en 3D qu'on visite en 2CV, avec une interface légère par-dessus. */
:root {
  --cream: #fbf3e4;      /* papier crème */
  --ink: #1f1a17;        /* encre brun-noir */
  --bordeaux: #7a1f2b;   /* rouge 2CV Charleston */
  --sky: #f6d9b3;        /* ciel de fin d'après-midi */
  --muted: #6d625a;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--f-display); -webkit-font-smoothing: antialiased; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
body.grabbing canvas#world { cursor: grabbing; }
.label { font: 500 0.72rem var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; }

/* ---------- Écran de chargement : deux volets qui s'ouvrent ---------- */
.loader { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.loader .panel { position: absolute; left: 0; right: 0; height: 50.5%; background: var(--ink); transition: transform 1.3s cubic-bezier(.77,0,.18,1); }
.loader .p-top { top: 0; } .loader .p-bot { bottom: 0; }
.loader.open .p-top { transform: translateY(-100%); }
.loader.open .p-bot { transform: translateY(100%); transition-delay: .08s; }
.loader .info { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; color: var(--cream);
  padding: calc(env(safe-area-inset-top, 0px) + 1.4rem) max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 1.4rem) max(22px, env(safe-area-inset-left, 0px)); transition: opacity .4s; }
.loader.open .info { opacity: 0; }
.loader .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; }
.loader .count { font: 800 clamp(5.5rem, 24vw, 19rem)/0.78 var(--f-display); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.loader .bar { position: absolute; left: 0; top: 50%; height: 2px; width: 0; background: var(--cream); transform: translateY(-50%); }
.loader.open .bar { opacity: 0; transition: opacity .2s; }
.loader .road { display: inline-block; width: 2.4rem; height: 2px; background: repeating-linear-gradient(90deg, currentColor 0 6px, transparent 6px 11px); vertical-align: middle; margin-inline: .5rem; animation: road .5s linear infinite; }
@keyframes road { to { background-position: 11px 0; } }

/* ---------- Interface par-dessus la ville ---------- */
.ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.ui > * { pointer-events: auto; }
.top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; align-items: center; gap: 1rem;
  padding: calc(env(safe-area-inset-top, 0px) + 1.1rem) max(22px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.top > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: .6rem; font: 800 1.25rem var(--f-display); letter-spacing: -0.03em; text-decoration: none; color: var(--ink); }
.logo i { width: 1.6rem; height: 1rem; border-radius: 1rem 1rem .3rem .3rem; background: var(--bordeaux); position: relative; }
.logo i::after { content: ""; position: absolute; left: .2rem; right: .2rem; bottom: -.28rem; height: .38rem; background: radial-gradient(circle at 22% 50%, var(--ink) 0 .17rem, transparent .19rem), radial-gradient(circle at 78% 50%, var(--ink) 0 .17rem, transparent .19rem); }
.pills { display: flex; gap: .5rem; }
.pill { font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: .62rem 1.05rem; border-radius: 999px; border: 1.5px solid var(--ink); color: var(--ink); background: color-mix(in srgb, var(--cream) 60%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; text-decoration: none; transition: background .3s, color .3s, transform .4s cubic-bezier(.16,1,.3,1); }
.pill:hover { background: var(--ink); color: var(--cream); }
.pill.solid { background: var(--ink); color: var(--cream); }
.pill.solid:hover { background: var(--bordeaux); border-color: var(--bordeaux); }

/* Grand titre d'accueil */
.hero { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); max-width: min(46rem, 90vw); pointer-events: none; transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1), filter .9s; }
.hero.away { opacity: 0; transform: translateY(-50%) translateX(-6vw); filter: blur(10px); }
.hero .label { color: var(--bordeaux); display: block; margin-bottom: 1.1rem; }
.hero h1 { margin: 0; font: 800 clamp(3rem, 8.4vw, 7.6rem)/0.88 var(--f-display); letter-spacing: -0.055em; text-wrap: balance; }
.hero h1 .ln { display: block; overflow: hidden; padding-bottom: .06em; }
.hero h1 .ch { display: inline-block; transform: translateY(115%) rotate(8deg); transition: transform 1s cubic-bezier(.16,1,.3,1); }
.hero.show h1 .ch { transform: none; }
.hero h1 em { font-style: normal; color: var(--bordeaux); }
.hero p { margin: 1.3rem 0 0; font: 500 clamp(1rem, 1.6vw, 1.2rem)/1.45 var(--f-display); max-width: 30ch; color: var(--muted); opacity: 0; transform: translateY(14px); transition: opacity .9s 1s, transform .9s 1s cubic-bezier(.16,1,.3,1); }
.hero.show p { opacity: 1; transform: none; }

.hero::before { content: ""; position: absolute; inset: -3rem -4rem -3rem -3rem; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse at 35% 50%, color-mix(in srgb, var(--cream) 82%, transparent) 0%, color-mix(in srgb, var(--cream) 55%, transparent) 45%, transparent 72%); filter: blur(6px); }
@media (max-width: 640px) { .hero p { color: var(--ink); } }

/* Indications de conduite */
.hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.6rem); transform: translate(-50%, 20px); display: flex; align-items: center; gap: .9rem; opacity: 0; transition: opacity .8s, transform .8s cubic-bezier(.16,1,.3,1); padding: .7rem 1rem; border-radius: 1rem; background: color-mix(in srgb, var(--cream) 70%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
.hint.show { opacity: 1; transform: translate(-50%, 0); }
.hint.gone { opacity: 0; transform: translate(-50%, 20px); }
.keys { display: grid; grid-template-columns: repeat(3, 1.8rem); grid-template-rows: repeat(2, 1.8rem); gap: .25rem; }
.keys kbd { display: grid; place-items: center; font: 500 .8rem var(--f-mono); border: 1.5px solid var(--ink); border-radius: .45rem; background: var(--cream); box-shadow: 0 2px 0 var(--ink); }
.keys kbd[data-k="up"] { grid-column: 2; grid-row: 1; } .keys kbd[data-k="left"] { grid-column: 1; grid-row: 2; } .keys kbd[data-k="down"] { grid-column: 2; grid-row: 2; } .keys kbd[data-k="right"] { grid-column: 3; grid-row: 2; }
.keys kbd.on { transform: translateY(2px); box-shadow: none; background: var(--ink); color: var(--cream); }

/* Bandeau de quartier : apparaît quand on entre dans une zone */
.zone { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 5.2rem); transform: translateX(-50%); text-align: center; pointer-events: none; }
.zone .label { display: block; color: var(--bordeaux); clip-path: inset(0 0 100% 0); transform: translateY(8px); transition: clip-path .7s cubic-bezier(.77,0,.18,1), transform .7s cubic-bezier(.77,0,.18,1); }
.zone b { display: block; margin-top: .35rem; font: 800 clamp(2rem, 5.5vw, 4.4rem)/0.9 var(--f-display); letter-spacing: -0.05em; white-space: nowrap; clip-path: inset(0 0 100% 0); transform: translateY(30px); transition: clip-path .9s .08s cubic-bezier(.77,0,.18,1), transform .9s .08s cubic-bezier(.77,0,.18,1); }
.zone.on .label, .zone.on b { clip-path: inset(0 0 -10% 0); transform: none; }
.zone.off .label, .zone.off b { clip-path: inset(0 0 0 0); transform: translateY(-30px); opacity: 0; transition-duration: .6s; }

/* Compteur de vitesse */
.speed { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 1.4rem); text-align: right; opacity: 0; transition: opacity .8s; pointer-events: none; }
.speed.show { opacity: 1; }
.speed b { display: block; font: 800 clamp(2.4rem, 5vw, 3.6rem)/0.9 var(--f-display); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }

/* Commandes tactiles */
.touch { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); display: none; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); opacity: 0; transition: opacity .8s; }
.touch.show { opacity: 1; }
.touch .grp { display: flex; gap: .6rem; }
.touch button { width: 4.2rem; height: 4.2rem; border-radius: 50%; border: 1.5px solid var(--ink); background: color-mix(in srgb, var(--cream) 75%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font: 800 1.4rem var(--f-display); color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none; }
.touch button.on { background: var(--ink); color: var(--cream); }
@media (hover: none) and (pointer: coarse) { .touch { display: flex; } .hint, .speed { display: none; } }

/* Flash de transition quand on démarre */
.wipe { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(circle at 50% 60%, transparent 0 30%, color-mix(in srgb, var(--cream) 50%, transparent) 70%); opacity: 0; transition: opacity 1.2s; }
.wipe.on { opacity: 1; transition: opacity .15s; }

@media (max-width: 640px) {
  .pills .pill:not(.solid) { display: none; }
  .hero { top: 30%; }
}
@media (prefers-reduced-motion: reduce) { .hero h1 .ch, .hero p, .hero, .loader .panel { transition: none !important; } }
:focus-visible { outline: 2px solid var(--bordeaux); outline-offset: 3px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="world" aria-label="Mini-ville en 3D : conduisez la 2CV avec les flèches du clavier"></canvas>

<div class="loader" id="loader" aria-hidden="true">
  <div class="panel p-top"></div><div class="panel p-bot"></div><div class="bar" id="bar"></div>
  <div class="info">
    <div class="row label"><span>Atelier Folio</span><span>Démarrage du moteur<span class="road"></span></span></div>
    <div class="row"><span class="count" id="count">0</span><span class="label">Mini-ville · 2CV</span></div>
  </div>
</div>

<div class="wipe" id="wipe"></div>

<div class="ui">
  <header class="top">
    <nav class="pills" aria-label="Navigation">
      <a class="pill" href="../">Exemple de portfolio ↗</a>
      <a class="pill solid" href="#modeles">Voir les modèles</a>
    </nav>
  </header>


  <div class="hint" id="hint" aria-hidden="true"></div>

  <div class="zone" id="zone" aria-live="polite"><span class="label" id="zone-k"></span><b id="zone-t"></b></div>

  <div class="speed" id="speedo" aria-hidden="true"><b id="kmh">0</b><span class="label">km/h</span></div>

  <div class="touch" id="touch">
    <div class="grp"><button data-k="left" aria-label="Tourner à gauche">←</button><button data-k="right" aria-label="Tourner à droite">→</button></div>
    <div class="grp"><button data-k="down" aria-label="Freiner, reculer">↓</button><button data-k="up" aria-label="Accélérer">↑</button></div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
